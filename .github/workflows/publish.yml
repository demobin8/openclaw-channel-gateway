name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Debug npm auth
        run: |
          echo "=== npm config ==="
          npm config list
          echo "=== .npmrc ==="
          cat ~/.npmrc 2>/dev/null || echo "no ~/.npmrc"
          cat /home/runner/work/_temp/.npmrc 2>/dev/null || echo "no temp .npmrc"
          echo "=== npm whoami ==="
          npm whoami --registry https://registry.npmjs.org 2>&1 || true
          echo "=== npm access ==="
          npm access ls-collaborators openclaw-channel-gateway --registry https://registry.npmjs.org 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
