name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # DO NOT set registry-url here — it injects _authToken=${NODE_AUTH_TOKEN}
          # into .npmrc, which short-circuits npm's OIDC Trusted Publishing code path
          # and causes a misleading E404 on publish.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
