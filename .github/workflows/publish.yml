name: Publish to npm

on:
  push:
    branches: [master]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get OIDC token and set as npm auth
        run: |
          echo "=== Getting GitHub OIDC token ==="
          
          # Get GitHub OIDC token with correct audience for npm
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://registry.npmjs.org/" | jq -r .value)
          
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Failed to get OIDC token from GitHub"
            exit 1
          fi
          echo "OIDC token obtained (length: ${#OIDC_TOKEN})"
          
          # Set as NODE_AUTH_TOKEN and configure npm
          echo "NODE_AUTH_TOKEN=$OIDC_TOKEN" >> $GITHUB_ENV
          npm config set //registry.npmjs.org/:_authToken=$OIDC_TOKEN
          
          echo "=== Verifying npm auth ==="
          npm whoami --registry https://registry.npmjs.org 2>&1 || echo "whoami failed (expected if using OIDC token)"
          
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
